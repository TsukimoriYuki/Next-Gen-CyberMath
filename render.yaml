# Render Blueprint — Web Service + Managed PostgreSQL
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cyber-math
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: cyber-math-db
          property: connectionString
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # 認証必須。未設定だと signJWT が throw し、ログイン/登録が 500 になり
      # 復習キュー（要ログイン）が一切使えなくなる。Render が安全な値を自動生成する。
      - key: JWT_SECRET
        generateValue: true
      # AI作戦会議で Gemini を使う場合に設定（未設定でも rule-based fallback で動作）。
      # 値はダッシュボードで入力する（ブループリントに秘密鍵は記載しない）。
      - key: GEMINI_API_KEY
        sync: false
      # /api/common-test/oracle はこちらを優先的に参照する（無ければ GEMINI_API_KEY）。
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      # 師範(MENTOR)ロールの付与コード。未設定なら全員 STUDENT として登録される。
      - key: MENTOR_PASSCODE
        sync: false

databases:
  - name: cyber-math-db
    plan: basic-256mb
    region: singapore
    databaseName: cyber_math
    postgresMajorVersion: "16"
