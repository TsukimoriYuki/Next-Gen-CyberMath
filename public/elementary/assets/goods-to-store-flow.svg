<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">品物がお店へ届くまでの流れ</title>
  <desc id="desc">作る場所、倉庫、配達、お店、家を矢印でつないだ学習用の図です。</desc>
  <rect width="960" height="480" rx="28" fill="#f7fbf4"/>
  <text x="48" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#173321">ひかり市「あおば店」の品物の流れ</text>
  <g font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#173321">
    <g fill="#fff" stroke="#287a4d" stroke-width="4"><rect x="35" y="150" width="150" height="130" rx="20"/><rect x="220" y="150" width="150" height="130" rx="20"/><rect x="405" y="150" width="150" height="130" rx="20"/><rect x="590" y="150" width="150" height="130" rx="20"/><rect x="775" y="150" width="150" height="130" rx="20"/></g>
    <text x="110" y="215" font-size="25">作る場所</text><text x="295" y="215" font-size="25">そうこ</text><text x="480" y="205" font-size="25">はいたつ</text><text x="480" y="240" font-size="22">トラック</text><text x="665" y="215" font-size="25">あおば店</text><text x="850" y="215" font-size="25">家</text>
  </g>
  <g stroke="#b45309" stroke-width="7" fill="none"><path d="M185 215h30l-14-12m14 12-14 12M370 215h30l-14-12m14 12-14 12M555 215h30l-14-12m14 12-14 12M740 215h30l-14-12m14 12-14 12"/></g>
  <text x="48" y="355" font-family="sans-serif" font-size="25" fill="#52645a">この図は学習のために作ったものです。品物によって、道すじはちがいます。</text>
</svg>
