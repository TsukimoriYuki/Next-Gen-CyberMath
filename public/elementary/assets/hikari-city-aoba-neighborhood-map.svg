<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img">
  <title>ひかり市 あおば小学校のまわりの学習用地図</title>
  <desc>学習用の架空地図。中央にあおば小学校、上（北）に公園、下（南）に駅とお店、右（東）に家、左（西）に川。</desc>
  <rect x="0" y="0" width="720" height="560" fill="#f8fafc" stroke="#334155" stroke-width="2" />

  <!-- 川（西・左） -->
  <path d="M40 10 C 70 120, 20 240, 55 360 C 75 460, 40 520, 60 550 L 20 550 L 20 10 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2" />
  <text x="34" y="140" font-family="sans-serif" font-size="20" fill="#075985" transform="rotate(90 34 140)">川</text>

  <!-- 道路（東西） -->
  <rect x="70" y="300" width="560" height="44" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <line x1="70" y1="322" x2="630" y2="322" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="14 12" />
  <text x="90" y="292" font-family="sans-serif" font-size="18" fill="#475569">道路</text>
  <!-- 駅へつづく道 -->
  <rect x="270" y="344" width="40" height="90" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />

  <!-- 公園（北・上） -->
  <circle cx="330" cy="90" r="46" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <circle cx="315" cy="80" r="16" fill="#4ade80" stroke="#15803d" stroke-width="2" />
  <circle cx="345" cy="86" r="20" fill="#22c55e" stroke="#15803d" stroke-width="2" />
  <text x="300" y="150" font-family="sans-serif" font-size="20" fill="#166534">公園</text>

  <!-- 学校（中央） -->
  <rect x="250" y="230" width="110" height="60" fill="#fef9c3" stroke="#ca8a04" stroke-width="3" />
  <line x1="360" y1="230" x2="360" y2="200" stroke="#78350f" stroke-width="3" />
  <path d="M360 200 L 392 208 L 360 216 Z" fill="#f97316" stroke="#c2410c" stroke-width="1.5" />
  <rect x="292" y="256" width="26" height="34" fill="#fde68a" stroke="#ca8a04" stroke-width="2" />
  <text x="238" y="222" font-family="sans-serif" font-size="20" fill="#854d0e">あおば小学校</text>

  <!-- 交番（道路の近く・西より） -->
  <rect x="150" y="256" width="42" height="42" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="158" y="283" font-family="sans-serif" font-size="18" fill="#991b1b">交</text>
  <text x="146" y="248" font-family="sans-serif" font-size="16" fill="#991b1b">交番</text>

  <!-- 家（東・右） -->
  <g stroke="#7c3aed" stroke-width="2" fill="#ede9fe">
    <path d="M520 150 L 545 130 L 570 150 L 570 190 L 520 190 Z" />
    <path d="M585 170 L 610 150 L 635 170 L 635 210 L 585 210 Z" />
    <path d="M540 220 L 565 200 L 590 220 L 590 260 L 540 260 Z" />
    <path d="M605 235 L 630 215 L 655 235 L 655 275 L 605 275 Z" />
  </g>
  <text x="560" y="120" font-family="sans-serif" font-size="20" fill="#5b21b6">家</text>

  <!-- 駅（南・下） -->
  <rect x="240" y="440" width="100" height="54" fill="#e0f2fe" stroke="#0369a1" stroke-width="3" />
  <line x1="250" y1="500" x2="330" y2="500" stroke="#334155" stroke-width="3" />
  <line x1="255" y1="508" x2="325" y2="508" stroke="#334155" stroke-width="3" />
  <text x="272" y="474" font-family="sans-serif" font-size="20" fill="#075985">駅</text>

  <!-- お店（駅の近く） -->
  <g stroke="#ea580c" stroke-width="2">
    <rect x="150" y="452" width="46" height="40" fill="#ffedd5" />
    <rect x="148" y="446" width="50" height="10" fill="#fb923c" />
    <rect x="360" y="452" width="46" height="40" fill="#ffedd5" />
    <rect x="358" y="446" width="50" height="10" fill="#fb923c" />
    <rect x="410" y="452" width="46" height="40" fill="#ffedd5" />
    <rect x="408" y="446" width="50" height="10" fill="#fb923c" />
  </g>
  <text x="150" y="440" font-family="sans-serif" font-size="18" fill="#9a3412">お店</text>

  <!-- 方位記号 -->
  <g transform="translate(662 60)">
    <line x1="0" y1="34" x2="0" y2="-34" stroke="#334155" stroke-width="3" />
    <path d="M0 -40 L 8 -22 L -8 -22 Z" fill="#334155" />
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#334155" stroke-width="2" />
    <text x="-7" y="-44" font-family="sans-serif" font-size="16" fill="#334155">北</text>
    <text x="-7" y="54" font-family="sans-serif" font-size="16" fill="#334155">南</text>
    <text x="34" y="6" font-family="sans-serif" font-size="16" fill="#334155">東</text>
    <text x="-48" y="6" font-family="sans-serif" font-size="16" fill="#334155">西</text>
  </g>

  <!-- はんれい -->
  <g transform="translate(486 372)">
    <rect x="0" y="0" width="216" height="172" fill="#ffffff" stroke="#334155" stroke-width="2" />
    <text x="12" y="26" font-family="sans-serif" font-size="18" fill="#0f172a">はんれい</text>
    <rect x="14" y="40" width="20" height="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" />
    <text x="44" y="53" font-family="sans-serif" font-size="15" fill="#334155">学校</text>
    <path d="M14 74 L 24 66 L 34 74 L 34 88 L 14 88 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
    <text x="44" y="86" font-family="sans-serif" font-size="15" fill="#334155">家</text>
    <rect x="14" y="104" width="20" height="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2" />
    <text x="44" y="117" font-family="sans-serif" font-size="15" fill="#334155">お店</text>
    <circle cx="24" cy="140" r="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="44" y="146" font-family="sans-serif" font-size="15" fill="#334155">公園</text>
    <rect x="118" y="40" width="20" height="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" />
    <text x="148" y="53" font-family="sans-serif" font-size="15" fill="#334155">駅</text>
    <rect x="118" y="72" width="20" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="148" y="85" font-family="sans-serif" font-size="15" fill="#334155">交番</text>
    <path d="M118 112 q 5 -8 10 0 q 5 8 10 0" fill="none" stroke="#0284c7" stroke-width="3" />
    <text x="148" y="117" font-family="sans-serif" font-size="15" fill="#334155">川</text>
    <rect x="118" y="134" width="20" height="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <text x="148" y="146" font-family="sans-serif" font-size="15" fill="#334155">道路</text>
  </g>
</svg>
