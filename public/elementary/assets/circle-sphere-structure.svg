<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">円と球の中心、半けい、直けい</title><desc id="desc">円の中心から半けいと直けいをしめし、球とのちがいをくらべる図</desc>
  <rect width="960" height="480" rx="28" fill="#f4fbff"/>
  <text x="260" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#24324a">平らな円</text><text x="730" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#24324a">立体の球</text>
  <circle cx="260" cy="250" r="150" fill="#ffffff" stroke="#174f75" stroke-width="7"/><circle cx="260" cy="250" r="9" fill="#24324a"/>
  <path d="M110 250H410" stroke="#d04f4f" stroke-width="6"/><path data-radius-length="150" d="M260 250L366.066 143.934" stroke="#15803d" stroke-width="6"/>
  <g font-size="22" fill="#24324a"><text x="265" y="280">中心</text><text x="315" y="180">半けい</text><text x="190" y="235">直けい</text></g>
  <circle cx="730" cy="250" r="150" fill="#dff3ff" stroke="#174f75" stroke-width="7"/><ellipse cx="730" cy="250" rx="150" ry="55" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="12 8"/><circle cx="730" cy="250" r="9" fill="#24324a"/>
  <text x="730" y="440" text-anchor="middle" font-size="24" fill="#24324a">まん中で切った面は円</text>
</svg>
